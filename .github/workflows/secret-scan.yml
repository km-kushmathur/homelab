# This repository documents credential-handling infrastructure, and its scripts
# deliberately have no fallback secrets. This job enforces that: any credential
# that reaches a commit fails the build rather than sitting in history.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
