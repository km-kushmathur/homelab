# Example Proxmox LXC config for the media server container (CT 201).
# Lives at /etc/pve/lxc/201.conf on the hypervisor.
#
# Placeholders and device GIDs must be adjusted for your own hardware --
# see docs/setup/04-jellyfin.md for how to find the correct render/card GIDs.

arch: amd64
cores: 2
hostname: jellyfin
memory: 8192
swap: 512
ostype: debian
rootfs: local-lvm:vm-201-disk-0,size=16G
onboot: 0
hookscript: local:snippets/media-storage-hook.sh
tags: media

# Static IP on the host bridge. hwaddr is omitted on purpose: Proxmox
# generates a unique MAC per container at creation time.
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,ip=192.168.1.11/24,type=veth

# Shared media root bind-mounted read-write from the host.
mp0: /mnt/media,mp=/mnt/media

# Intel iGPU passthrough for hardware transcoding.
# The gid values below must match `getent group render` and `getent group video`
# ON YOUR HOST. They differ between distributions.
dev0: /dev/dri/renderD128,gid=993
dev1: /dev/dri/card0,gid=44

features: nesting=1
