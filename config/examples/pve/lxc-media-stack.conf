# Example Proxmox LXC config for the Docker media-stack container (CT 204).
# Lives at /etc/pve/lxc/204.conf on the hypervisor.

arch: amd64
cores: 2
hostname: media-stack
memory: 4096
swap: 512
ostype: debian
rootfs: local-lvm:vm-204-disk-0,size=16G
onboot: 1
unprivileged: 1
tags: media

net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.1.1,ip=192.168.1.14/24,type=veth

# Same host path, same in-container path, as the media server. Path parity
# across every service that touches media is what makes hardlinking work.
mp0: /mnt/media,mp=/mnt/media

# nesting=1  -> allows Docker to run inside an unprivileged LXC
# keyctl=1   -> required by Docker's containerd for kernel keyring access
features: keyctl=1,nesting=1

# TUN device passthrough, required by the VPN container's WireGuard tunnel.
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
